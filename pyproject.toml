[project]
name = "sih3d"
version = "0.1.0"
description = "Single-pass drone video to georeferenced 3D reconstruction"
requires-python = ">=3.11,<3.13"
dependencies = [
  "einops>=0.8",
  "imageio-ffmpeg>=0.6",
  "gsplat>=1.5",
  "jaxtyping>=0.3",
  "matplotlib>=3.10",
  "laspy>=2.6",
  "ninja>=1.13",
  "nvidia-cuda-cccl==13.0.85; platform_system == 'Linux'",
  "nvidia-cuda-crt==13.0.88; platform_system == 'Linux'",
  "nvidia-cuda-nvcc==13.0.88; platform_system == 'Linux'",
  "nvidia-cuda-runtime==13.0.96; platform_system == 'Linux'",
  "nvidia-nvvm==13.0.88; platform_system == 'Linux'",
  "nvtx>=0.2",
  "opencv-python-headless>=4.11",
  "open3d>=0.19",
  "pillow>=11",
  "plyfile>=1.1",
  # VGGT's exporter relies on the legacy `registered` image field.
  "pycolmap==3.10.0",
  "pyproj>=3.7",
  "pyyaml>=6.0",
  "rasterio>=1.4",
  "rich>=14",
  "scipy>=1.15",
  "trimesh>=4.8",
  "transformers>=4.57",
]

[tool.ruff]
line-length = 88
